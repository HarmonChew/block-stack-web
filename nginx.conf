server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;

    location = /healthz { return 200 "ok\n"; }

    # Hashed bundle files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Bot games are already gzipped (the app inflates them itself), so they are
    # served as plain bytes. They change only when the bots are regenerated.
    location /bots/ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
